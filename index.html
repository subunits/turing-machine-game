const { useState, useEffect, useRef, useCallback } = React;

const STORAGE_KEY = "turing_craft_v4";
function loadSave() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); } catch { return {}; } }
function writeSave(d) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); } catch {} }

function useViewport() {
  const [vw, setVw] = useState(() => window.innerWidth);
  useEffect(() => {
    const u = () => setVw(window.innerWidth);
    window.addEventListener("resize", u);
    if (window.visualViewport) window.visualViewport.addEventListener("resize", u);
    return () => { window.removeEventListener("resize", u); if (window.visualViewport) window.visualViewport.removeEventListener("resize", u); };
  }, []);
  return { narrow: vw < 700 };
}

function runMachine(transitions, initialState, acceptStates, rejectStates, inputStr, maxSteps = 1000) {
  const tape = inputStr === "" ? ["_"] : inputStr.split("");
  let head = 0, state = initialState;
  const history = [{ tape: [...tape], head, state }];
  for (let i = 0; i < maxSteps; i++) {
    if (acceptStates.includes(state)) return { accepted: true, tape, history, timedOut: false };
    if (rejectStates.includes(state)) return { accepted: false, tape, history, timedOut: false };
    const sym = tape[head] ?? "_";
    const tr = (transitions[state] || {})[sym];
    if (!tr) return { accepted: false, tape, history, timedOut: false, error: `No transition: ${state} on '${sym}'` };
    const [ns, ws, dir] = tr;
    tape[head] = ws; state = ns;
    if (dir === "R") { head++; if (head >= tape.length) tape.push("_"); }
    else if (dir === "L") { head = Math.max(0, head - 1); }
    history.push({ tape: [...tape], head, state });
  }
  return { accepted: false, tape, history, timedOut: true };
}

function validate(transitions, initialState, acceptStates, rejectStates, testCases) {
  return testCases.map(tc => {
    const r = runMachine(transitions, initialState, acceptStates, rejectStates, tc.input);
    const actual = r.tape.join("").replace(/_+$/, "");
    const passed = r.accepted && actual === tc.expected;
    return { ...tc, passed, actual, accepted: r.accepted, timedOut: r.timedOut, history: r.history };
  });
}

// Compact formatter: keeps ["state","write","dir"] arrays on one line
function formatMachine(solution) {
  const stateLines = Object.entries(solution).map(([state, trans]) => {
    const symKeys = Object.keys(trans);
    if (symKeys.length === 0) return `  "${state}": {}`;
    const symLines = symKeys.map(sym => {
      const [ns, ws, dir] = trans[sym];
      return `    "${sym}": ["${ns}", "${ws}", "${dir}"]`;
    });
    return `  "${state}": {\n${symLines.join(",\n")}\n  }`;
  });
  return `{\n${stateLines.join(",\n")}\n}`;
}

LEVELS.forEach(lvl => {
  lvl.solutionStr = formatMachine(lvl.solution);
});

function useSwipe(onLeft, onRight) {
  const startX = useRef(null);
  return {
    onTouchStart: (e) => { startX.current = e.touches[0].clientX; },
    onTouchEnd: (e) => {
      if (startX.current === null) return;
      const dx = e.changedTouches[0].clientX - startX.current;
      if (Math.abs(dx) > 40) { dx < 0 ? onLeft() : onRight(); }
      startX.current = null;
    },
  };
}

// ─── Hint Panel ───────────────────────────────────────────────────────────────

function HintPanel({ level, onClose, onUseSolution, narrow }) {

    ...level.hints,
    { title: "Solution", body: level.solutionStr, isCode: true },
  ];
  const [idx, setIdx] = useState(0);
  const panel = panels[idx];
  const swipe = useSwipe(
    () => setIdx(i => Math.min(i + 1, panels.length - 1)),
    () => setIdx(i => Math.max(i - 1, 0))
  );
  return (
    <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.88)", zIndex:100,
      display:"flex", alignItems:"center", justifyContent:"center" }} onClick={onClose}>
      <div style={{

      }} onClick={e => e.stopPropagation()}>

        {/* Pinned header */}

            {panels.map((p, i) => (
              <button key={i} onClick={() => setIdx(i)} style={{
                background: i === idx ? "#6366f1" : "#2d2d44", border:"none", borderRadius:6,

              }}>{p.title}</button>
            ))}
          </div>

          {panel.isCode ? (
            <pre style={{ background:"#0a0a15", border:"1px solid #2d2d44", borderRadius:10,

            <button onClick={() => setIdx(i => Math.max(i-1,0))} disabled={idx===0} style={{
              background: idx===0 ? "#1a1a2e" : "#2d2d44", border:"1px solid #3d3d5e", borderRadius:8,

// ─── Tape Viz ─────────────────────────────────────────────────────────────────

function TapeViz({ tape, head, state, stepIdx, totalSteps, narrow }) {
  const cellW = narrow ? 36 : 44, cellH = narrow ? 36 : 44, pad = 4;
  const count = narrow ? 9 : 13;
  const start = Math.max(0, head - Math.floor(count/2));
  const cells = Array.from({length:count}, (_,i) => ({ sym: tape[start+i]??"_", isHead: start+i===head }));
  const svgW = count*(cellW+pad)+pad;
  return (
    <div style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:8 }}>
      <svg width={svgW} height={narrow?80:100} style={{ overflow:"visible", maxWidth:"100%" }}>
        {cells.map((c,i) => {
          const x=i*(cellW+pad)+pad, y=narrow?20:28;
          return (
            <g key={i}>
              <rect x={x} y={y} width={cellW} height={cellH} rx={5}
                fill={c.isHead?"#6366f1":c.sym==="_"?"#1e1e2e":"#2d2d44"}
                stroke={c.isHead?"#a5b4fc":"#3d3d5e"} strokeWidth={c.isHead?2:1}/>
              <text x={x+cellW/2} y={y+cellH/2+5} textAnchor="middle"
                fontSize={narrow?14:18} fontFamily="monospace"
                fill={c.isHead?"#fff":c.sym==="_"?"#444":"#c4c4d4"}>{c.sym}</text>
              {c.isHead && <text x={x+cellW/2} y={y-6} textAnchor="middle" fontSize={10} fill="#a5b4fc">▼</text>}
            </g>
          );
        })}
      </svg>
      <div style={{ display:"flex", gap:16, fontSize:12, color:"#888" }}>
        <span>State: <span style={{ color:"#a5b4fc", fontFamily:"monospace" }}>{state}</span></span>
        <span>Head: <span style={{ color:"#a5b4fc" }}>{head}</span></span>
        {totalSteps>0 && <span>Step: <span style={{ color:"#a5b4fc" }}>{stepIdx+1}/{totalSteps}</span></span>}
      </div>
    </div>
  );
}

// ─── State Diagram ────────────────────────────────────────────────────────────

function StateDiagram({ transitions, currentState }) {
  const states = Object.keys(transitions||{});
  if (!states.length) return null;
  const r=26, svgW=500, maxPerRow=Math.min(states.length,5);
  const numRows=Math.ceil(states.length/maxPerRow);
  const svgH=50+numRows*95;
  const pos={};
  states.forEach((s,i) => {
    pos[s]={ x:55+(i%maxPerRow)*((svgW-110)/Math.max(maxPerRow-1,1)), y:55+Math.floor(i/maxPerRow)*95 };
  });
  const edges=[];
  states.forEach(from => {
    const tm={};
    Object.entries(transitions[from]||{}).forEach(([sym,arr]) => {
      if (!Array.isArray(arr)) return;
      const key=`${from}->${arr[0]}`;
      if (!tm[key]) tm[key]=[];
      tm[key].push(`${sym}:${arr[1]},${arr[2]}`);
    });
    Object.entries(tm).forEach(([key,labels]) => {
      const [f,t]=key.split("->");
      if (pos[f]&&pos[t]) edges.push({from:f,to:t,label:labels.join(" | ")});
    });
  });
  return (
    <svg width="100%" viewBox={`0 0 ${svgW} ${svgH}`} preserveAspectRatio="xMidYMid meet"
      style={{ background:"#0f0f1a", borderRadius:10, border:"1px solid #2d2d44", width:"100%", height:"auto", aspectRatio:`${svgW} / ${svgH}`, display:"block", flexShrink:0 }}>
      <defs>
        <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
          <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
        </marker>
      </defs>
      {edges.map((e,i) => {
        const fp=pos[e.from], tp=pos[e.to]; if (!fp||!tp) return null;
        if (e.from===e.to) return (
          <g key={i}>
            <path d={`M${fp.x-10},${fp.y-r} C${fp.x-36},${fp.y-64} ${fp.x+36},${fp.y-64} ${fp.x+10},${fp.y-r}`}
              fill="none" stroke="#3d3d5e" strokeWidth={1.5} markerEnd="url(#arr)"/>
            <text x={fp.x} y={fp.y-62} textAnchor="middle" fontSize={8} fill="#666" fontFamily="monospace">{e.label}</text>
          </g>
        );
        const dx=tp.x-fp.x, dy=tp.y-fp.y, len=Math.sqrt(dx*dx+dy*dy);
        const ux=dx/len, uy=dy/len;
        const x1=fp.x+ux*r, y1=fp.y+uy*r, x2=tp.x-ux*(r+8), y2=tp.y-uy*(r+8);
        const mx=(x1+x2)/2-uy*18, my=(y1+y2)/2+ux*18;
        return (
          <g key={i}>
            <path d={`M${x1},${y1} Q${mx},${my} ${x2},${y2}`}
              fill="none" stroke="#3d3d5e" strokeWidth={1.5} markerEnd="url(#arr)"/>
            <text x={mx} y={my-3} textAnchor="middle" fontSize={8} fill="#666" fontFamily="monospace">{e.label}</text>
          </g>
        );
      })}
      {states.map(s => {
        const p=pos[s]; if (!p) return null;
        const isA=s==="accept", isR=s==="reject", isAct=s===currentState;
        return (
          <g key={s}>
            <circle cx={p.x} cy={p.y} r={r}
              fill={isAct?"#6366f1":isA?"#1a3a2a":isR?"#3a1a1a":"#1e1e2e"}
              stroke={isAct?"#a5b4fc":isA?"#4ade80":isR?"#f87171":"#3d3d5e"}
              strokeWidth={isAct?2.5:1.5}/>
            {isA && <circle cx={p.x} cy={p.y} r={r-4} fill="none" stroke="#4ade80" strokeWidth={1}/>}
            <text x={p.x} y={p.y+4} textAnchor="middle" fontSize={9} fontFamily="monospace"
              fill={isAct?"#fff":isA?"#4ade80":isR?"#f87171":"#aaa"}>
              {s.length>7?s.slice(0,6)+"…":s}
            </text>
          </g>
        );
      })}
    </svg>
  );
}

// ─── Test Results ─────────────────────────────────────────────────────────────

function TestResults({ results, onStep }) {
  return (
    <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
      {results.map((r,i) => (
        <div key={i} style={{
          background: r.passed?"#0d2a1a":"#2a0d0d",
          border:`1px solid ${r.passed?"#4ade80":"#f87171"}`,
          borderRadius:8, padding:"12px 14px",
        }}>
          <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", gap:10 }}>
            <div style={{ display:"flex", gap:10, alignItems:"flex-start" }}>
              <span style={{ fontSize:16, lineHeight:1.4 }}>{r.passed?"✓":"✗"}</span>
              <div>
                <div style={{ fontSize:12, color:"#888", marginBottom:2 }}>{r.description}</div>
                <div style={{ fontFamily:"monospace", fontSize:13, color:"#ccc" }}>
                  <span style={{ color:"#888" }}>in:</span> "{r.input}"&nbsp;
                  <span style={{ color:"#888" }}>exp:</span> "{r.expected}"
                </div>
                {!r.passed && (
                  <div style={{ fontFamily:"monospace", fontSize:13, color:"#f87171", marginTop:2 }}>
                    got: "{r.actual}"{r.timedOut?" (timed out)":""}
                  </div>
                )}
              </div>
            </div>
            {!r.passed && r.history && (
              <button onClick={() => onStep(r)} style={{
                background:"#2d2d44", border:"1px solid #4d4d70", borderRadius:8,
                color:"#a5b4fc", fontSize:13, padding:"10px 14px",
                cursor:"pointer", whiteSpace:"nowrap", minHeight:44, flexShrink:0,
              }}>Step →</button>
            )}
          </div>
        </div>
      ))}
    </div>
  );
}

// ─── Step Modal ───────────────────────────────────────────────────────────────

function StepModal({ result, transitions, onClose, narrow }) {
  const [idx, setIdx] = useState(0);
  const total = result.history.length;
  const frame = result.history[Math.min(idx, total-1)];
  const goNext = useCallback(() => setIdx(s => Math.min(s+1,total-1)), [total]);
  const goPrev = useCallback(() => setIdx(s => Math.max(s-1,0)), []);
  useEffect(() => {
    const h = e => { if(e.key==="ArrowRight")goNext(); if(e.key==="ArrowLeft")goPrev(); if(e.key==="Escape")onClose(); };
    window.addEventListener("keydown",h); return () => window.removeEventListener("keydown",h);
  }, [goNext,goPrev,onClose]);
  const swipe = useSwipe(goNext, goPrev);
  const btnS = (dis) => ({
    background:dis?"#1a1a2e":"#2d2d44", border:"1px solid #3d3d5e", borderRadius:8,
    color:dis?"#333":"#a5b4fc", minWidth:64, minHeight:44, padding:"10px 14px",
    cursor:dis?"default":"pointer", fontSize:15, fontWeight:600,
  });
  return (
    <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.88)", zIndex:100,
      display:"flex", alignItems:"center", justifyContent:"center" }} onClick={onClose}>
      <div style={{
        background:"#13131f", border:"1px solid #3d3d5e", borderRadius:16,
        padding:narrow?16:28, width:narrow?"100%":"90%", maxWidth:680,
        maxHeight:narrow?"92dvh":"90dvh", overflowY:"auto",
        display:"flex", flexDirection:"column", gap:16,
        ...(narrow?{position:"fixed",bottom:0,left:0,right:0,borderBottomLeftRadius:0,borderBottomRightRadius:0}:{}),
      }} onClick={e=>e.stopPropagation()} {...swipe}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
          <div>
            <div style={{ color:"#fff", fontWeight:600, fontSize:15 }}>"{result.input}"</div>
            <div style={{ color:"#666", fontSize:12, marginTop:2 }}>Swipe or tap to step</div>
          </div>
          <button onClick={onClose} style={{ background:"#2d2d44", border:"none", borderRadius:8,
            color:"#aaa", fontSize:18, width:44, height:44, cursor:"pointer",
            display:"flex", alignItems:"center", justifyContent:"center" }}>✕</button>
        </div>
        <TapeViz tape={frame.tape} head={frame.head} state={frame.state} stepIdx={idx} totalSteps={total} narrow={narrow}/>
        <StateDiagram transitions={transitions} currentState={frame.state}/>
        <div style={{ display:"flex", gap:8, justifyContent:"center" }}>
          <button onClick={()=>setIdx(0)} disabled={idx===0} style={btnS(idx===0)}>⟪</button>
          <button onClick={goPrev} disabled={idx===0} style={btnS(idx===0)}>←</button>
          <div style={{ flex:1, display:"flex", alignItems:"center", justifyContent:"center", color:"#555", fontSize:13 }}>{idx+1} / {total}</div>
          <button onClick={goNext} disabled={idx===total-1} style={btnS(idx===total-1)}>→</button>
          <button onClick={()=>setIdx(total-1)} disabled={idx===total-1} style={btnS(idx===total-1)}>⟫</button>
        </div>
      </div>
    </div>
  );
}

// ─── Editor ───────────────────────────────────────────────────────────────────

function EditorScreen({ level, onBack, onComplete, savedCode, onSave }) {
  const [code, setCode] = useState(savedCode || level.solutionStr);
  const [results, setResults] = useState(null);
  const [parseError, setParseError] = useState(null);
  const [stepTarget, setStepTarget] = useState(null);
  const [parsedTransitions, setParsedTransitions] = useState(null);
  const [tab, setTab] = useState("editor");
  const [showHints, setShowHints] = useState(false);
  const { narrow } = useViewport();
  const saveTimer = useRef(null);

  useEffect(() => {
    setCode(savedCode || level.solutionStr);
    setResults(null); setParseError(null); setParsedTransitions(null); setTab("editor");
  }, [level.id]);

  const handleChange = val => {
    setCode(val); setResults(null); setParseError(null);
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => onSave(level.id, val), 800);
  };

  const handleTest = useCallback(() => {
    let parsed;
    try { parsed = JSON.parse(code); } catch(e) { setParseError(e.message); setResults(null); return; }
    setParseError(null); setParsedTransitions(parsed);
    const res = validate(parsed, level.initial_state, level.accept_states, level.reject_states, level.test_cases);
    setResults(res); onSave(level.id, code);
    if (narrow) setTab("tests");
  }, [code, level, onSave, narrow]);

  useEffect(() => {
    const h = e => { if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){e.preventDefault();handleTest();} };
    window.addEventListener("keydown",h); return ()=>window.removeEventListener("keydown",h);
  }, [handleTest]);

  const allPassed = results && results.every(r=>r.passed);

  const testCaseList = level.test_cases.map((tc,i) => (
    <div key={i} style={{ background:"#1a1a2e", border:"1px solid #2d2d44", borderRadius:8, padding:"10px 14px", fontSize:13, marginBottom:6 }}>
      <span style={{ fontFamily:"monospace", color:"#aaa" }}>"{tc.input}"</span>
      <span style={{ color:"#555", margin:"0 8px" }}>→</span>
      <span style={{ fontFamily:"monospace", color:"#aaa" }}>"{tc.expected}"</span>
      <div style={{ color:"#555", fontSize:12, marginTop:3 }}>{tc.description}</div>
    </div>
  ));

  const toolbar = isN => (
    <div style={{ padding:"10px 16px", borderTop:"1px solid #2d2d44", display:"flex", gap:8, flexShrink:0, background:"#09090f" }}>
      <button onClick={()=>{setCode(level.solutionStr);setResults(null);setParseError(null);}}
        style={{ background:"#1e1e2e", border:"1px solid #3d3d5e", borderRadius:8,
          color:"#888", fontSize:13, padding:isN?"10px 12px":"8px 14px", cursor:"pointer", minHeight:44 }}>
        Reset
      </button>
      <button onClick={()=>setShowHints(true)}
        style={{ background:"#1e1e2e", border:"1px solid #4d4d70", borderRadius:8,
          color:"#a5b4fc", fontSize:13, padding:isN?"10px 12px":"8px 14px", cursor:"pointer", minHeight:44 }}>
        💡 Hints
      </button>
      <button onClick={handleTest} style={{
        flex:1, background:"#4f46e5", border:"none", borderRadius:8, color:"#fff",
        padding:isN?"10px":"8px 20px", cursor:"pointer", fontWeight:700,
        fontSize:isN?15:14, minHeight:44,
      }}>{isN?"Run Tests":"Run Tests (⌘↵)"}</button>
    </div>
  );

  const editorPane = isN => (
    <div style={{ flex:1, display:"flex", flexDirection:"column", overflow:"hidden" }}>
      {!isN && (
        <div style={{ padding:"10px 16px", background:"#0d0d1a", borderBottom:"1px solid #1e1e2e", flexShrink:0 }}>
          <div style={{ fontSize:12, color:"#888" }}>{level.description}</div>
        </div>
      )}
      <textarea value={code} onChange={e=>handleChange(e.target.value)}
        spellCheck={false} autoCorrect="off" autoCapitalize="none"
        style={{ flex:1, background:"#0a0a15", color:"#e2e2f2", fontFamily:"monospace",
          fontSize:isN?14:13, lineHeight:1.7, border:"none", outline:"none", padding:16, resize:"none" }}/>
      {parseError && (
        <div style={{ padding:"8px 16px", background:"#2a0d0d", color:"#f87171",
          fontSize:12, fontFamily:"monospace", flexShrink:0 }}>✗ {parseError}</div>
      )}
      {toolbar(isN)}
    </div>
  );

  const testsPane = (
    <div style={{ flex:1, overflowY:"auto", padding:16, display:"flex", flexDirection:"column", gap:12 }}>
      {results ? (
        <>
          <TestResults results={results} onStep={setStepTarget}/>
          {parsedTransitions && <StateDiagram transitions={parsedTransitions} currentState={level.initial_state}/>}
          {allPassed && (
            <button onClick={onComplete} style={{
              background:"linear-gradient(135deg,#4f46e5,#7c3aed)", border:"none",
              borderRadius:12, color:"#fff", padding:16, cursor:"pointer",
              fontWeight:700, fontSize:16, minHeight:54, boxShadow:"0 0 24px rgba(99,102,241,0.4)",
            }}>🎉 Complete Level →</button>
          )}
        </>
      ) : (
        <>
          <div style={{ fontSize:11, color:"#888", fontWeight:700, letterSpacing:1, textTransform:"uppercase", marginBottom:4 }}>Test Cases</div>
          {testCaseList}
          {narrow && (
            <button onClick={()=>setTab("editor")} style={{ background:"#1e1e2e", border:"1px solid #3d3d5e",
              borderRadius:8, color:"#a5b4fc", fontSize:14, padding:"12px", cursor:"pointer", minHeight:44, marginTop:4 }}>
              ← Back to Editor
            </button>
          )}
        </>
      )}
    </div>
  );

  return (
    <div style={{ display:"flex", flexDirection:"column", height:"100dvh", overflow:"hidden" }}>
      {/* Header */}
      <div style={{ display:"flex", alignItems:"center", gap:12,
        padding:narrow?"12px 16px":"14px 20px", borderBottom:"1px solid #2d2d44", flexShrink:0 }}>
        <button onClick={onBack} style={{ background:"none", border:"none", color:"#888",
          cursor:"pointer", fontSize:22, minWidth:44, minHeight:44,
          display:"flex", alignItems:"center", justifyContent:"center" }}>←</button>
        <div style={{ flex:1, minWidth:0 }}>
          <div style={{ fontSize:10, color:"#6366f1", fontWeight:700, letterSpacing:2, textTransform:"uppercase" }}>Level {level.id}</div>
          <div style={{ color:"#fff", fontWeight:700, fontSize:narrow?16:17,
            whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{level.name}</div>
        </div>
        {narrow && (
          <div style={{ display:"flex", background:"#1a1a2e", borderRadius:8, padding:3, gap:2, flexShrink:0 }}>
            {["editor","tests"].map(t => (
              <button key={t} onClick={()=>setTab(t)} style={{
                background:tab===t?"#2d2d44":"transparent", border:"none", borderRadius:6,
                color:tab===t?"#fff":"#555", padding:"6px 12px", cursor:"pointer",
                fontSize:13, fontWeight:600, minHeight:36,
              }}>{t==="editor"?"Editor":`Tests${results?` (${results.filter(r=>r.passed).length}/${results.length})`:""}`}</button>
            ))}
          </div>
        )}
      </div>

      {/* Hint bar */}
      <div style={{ padding:"8px 16px", background:"#0d0d1a", borderBottom:"1px solid #1e1e2e",
        fontSize:12, color:"#6366f1", flexShrink:0 }}>
        💡 {level.hints[0].body.split("\n")[0]}
      </div>

      {/* Body */}
      {narrow ? (
        <>
          {tab==="editor" && editorPane(true)}
          {tab==="tests" && testsPane}
        </>
      ) : (
        <div style={{ display:"flex", flex:1, overflow:"hidden" }}>
          {editorPane(false)}
          <div style={{ width:340, display:"flex", flexDirection:"column", overflowY:"auto", padding:16, gap:16, flexShrink:0, borderLeft:"1px solid #2d2d44" }}>
            <div>
              <div style={{ fontSize:11, color:"#888", fontWeight:700, letterSpacing:1, textTransform:"uppercase", marginBottom:8 }}>Test Cases</div>
              {results
                ? <TestResults results={results} onStep={setStepTarget}/>
                : testCaseList
              }
            </div>
            {parsedTransitions && (
              <div>
                <div style={{ fontSize:11, color:"#888", fontWeight:700, letterSpacing:1, textTransform:"uppercase", marginBottom:8 }}>State Diagram</div>
                <StateDiagram transitions={parsedTransitions} currentState={level.initial_state}/>
              </div>
            )}
            {allPassed && (
              <button onClick={onComplete} style={{
                background:"linear-gradient(135deg,#4f46e5,#7c3aed)", border:"none",
                borderRadius:10, color:"#fff", padding:14, cursor:"pointer",
                fontWeight:700, fontSize:15, minHeight:50,
                boxShadow:"0 0 24px rgba(99,102,241,0.4)", marginTop:"auto",
              }}>🎉 Complete Level →</button>
            )}
          </div>
        </div>
      )}

      {showHints && <HintPanel level={level} narrow={narrow} onClose={()=>setShowHints(false)} onUseSolution={sol=>handleChange(sol)}/>}
      {stepTarget && <StepModal result={stepTarget} transitions={parsedTransitions} onClose={()=>setStepTarget(null)} narrow={narrow}/>}
    </div>
  );
}

// ─── Level Select ─────────────────────────────────────────────────────────────

function LevelSelect({ completed, onSelect, onBack }) {
  return (
    <div style={{ height:"100dvh", overflowY:"auto" }}>
      <div style={{ padding:"24px 20px", maxWidth:600, margin:"0 auto" }}>
        <button onClick={onBack} style={{ background:"none", border:"none", color:"#888",
          cursor:"pointer", fontSize:15, marginBottom:20, minHeight:44,
          display:"flex", alignItems:"center", gap:6 }}>← Menu</button>
        <h2 style={{ color:"#fff", marginBottom:4, fontSize:22 }}>Select a Level</h2>
        <p style={{ color:"#555", fontSize:13, marginBottom:24 }}>{completed.length}/{LEVELS.length} completed</p>
        <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
          {LEVELS.map(lvl => {
            const done = completed.includes(lvl.id);
            return (
              <button key={lvl.id} onClick={()=>onSelect(lvl)} style={{
                background:done?"#0d2a1a":"#13131f",
                border:`1px solid ${done?"#4ade80":"#2d2d44"}`,
                borderRadius:12, padding:"18px 20px", cursor:"pointer",
                display:"flex", alignItems:"center", gap:16, textAlign:"left", width:"100%", minHeight:72,
              }}>
                <div style={{ width:40, height:40, borderRadius:"50%", flexShrink:0,
                  background:done?"#4ade80":"#1e1e2e", border:`2px solid ${done?"#4ade80":"#3d3d5e"}`,
                  display:"flex", alignItems:"center", justifyContent:"center",
                  color:done?"#0a0a15":"#555", fontWeight:700, fontSize:15,
                }}>{done?"✓":lvl.id}</div>
                <div style={{ minWidth:0 }}>
                  <div style={{ color:"#fff", fontWeight:600, fontSize:16 }}>{lvl.name}</div>
                  <div style={{ color:"#555", fontSize:13, marginTop:3 }}>{lvl.description}</div>
                </div>
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// ─── How To Play ──────────────────────────────────────────────────────────────

function HowToPlay({ onBack }) {
  const sections = [
    ["What is a Turing Machine?","A Turing machine reads a tape one symbol at a time, using states and transition rules to decide what to write and where to move. Your job is to define those rules."],
    ["Transition Format",'{\n  "state": {\n    "symbol": ["next_state", "write", "direction"]\n  }\n}\n\nDirections:  R right  L left  N stay\nSpecial:     _ blank cell'],
    ["Controls","Run Tests — run all test cases\n💡 Hints — step through hint → walk-through → solution\nStep → — walk a failed test frame by frame\nReset — restore the working solution"],
    ["Tips","• Each level starts with a working solution — study it, then try modifying it\n• Use Hints to see the walk-through before looking at the solution\n• Use Step → on failed tests to find where things go wrong\n• The state diagram updates after each run"],
  ];
  return (
    <div style={{ height:"100dvh", overflowY:"auto" }}>
      <div style={{ padding:"24px 20px", maxWidth:560, margin:"0 auto" }}>
        <button onClick={onBack} style={{ background:"none", border:"none", color:"#888",
          cursor:"pointer", fontSize:15, marginBottom:20, minHeight:44 }}>← Back</button>
        <h2 style={{ color:"#fff", marginBottom:24 }}>How to Play</h2>
        {sections.map(([title,body]) => (
          <div key={title} style={{ marginBottom:24 }}>
            <div style={{ color:"#a5b4fc", fontWeight:700, marginBottom:8 }}>{title}</div>
            <pre style={{ color:"#aaa", fontSize:13, lineHeight:1.8, margin:0,
              fontFamily:body.includes('"')?"monospace":"inherit", whiteSpace:"pre-wrap" }}>{body}</pre>
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── Main Menu ────────────────────────────────────────────────────────────────

function MainMenu({ onStart, onSelectLevel, onHowTo, completed }) {
  return (
    <div style={{ display:"flex", flexDirection:"column", alignItems:"center",
      justifyContent:"center", height:"100dvh", padding:24, textAlign:"center" }}>
      <svg width={64} height={64} viewBox="0 0 72 72" style={{ marginBottom:16 }}>
        {[0,1,2,3,4].map(i=>(
          <rect key={i} x={6+i*13} y={20} width={11} height={32} rx={3}
            fill={i===2?"#6366f1":"#1e1e2e"} stroke={i===2?"#a5b4fc":"#3d3d5e"} strokeWidth={1.5}/>
        ))}
        {["_","a","q0","b","_"].map((s,i)=>(
          <text key={i} x={11.5+i*13} y={41} textAnchor="middle" fontSize={9}
            fontFamily="monospace" fill={i===2?"#fff":"#444"}>{s}</text>
        ))}
        <text x={36} y={64} textAnchor="middle" fontSize={11} fill="#6366f1">▲</text>
      </svg>
      <h1 style={{ color:"#fff", fontSize:28, fontWeight:800, marginBottom:6, letterSpacing:-0.5 }}>Turing Craft</h1>
      <p style={{ color:"#666", fontSize:14, maxWidth:320, marginBottom:36, lineHeight:1.6 }}>
        Build state machines. Solve puzzles. Learn automata theory by doing.
      </p>
      <div style={{ display:"flex", flexDirection:"column", gap:12, width:"100%", maxWidth:280 }}>
        <button onClick={onStart} style={{
          background:"linear-gradient(135deg,#4f46e5,#7c3aed)", border:"none",
          borderRadius:12, color:"#fff", padding:16, fontWeight:700, fontSize:16,
          cursor:"pointer", minHeight:54, boxShadow:"0 0 20px rgba(99,102,241,0.3)",
        }}>{completed.length>0?`Continue (${completed.length}/${LEVELS.length})`:"Start Puzzle"}</button>
        <button onClick={onSelectLevel} style={{
          background:"#1a1a2e", border:"1px solid #3d3d5e", borderRadius:12,
          color:"#a5b4fc", padding:14, fontWeight:600, fontSize:15, cursor:"pointer", minHeight:50,
        }}>Level Select</button>
        <button onClick={onHowTo} style={{
          background:"none", border:"none", color:"#555", padding:12,
          fontWeight:500, fontSize:14, cursor:"pointer", minHeight:44,
        }}>How to Play</button>
      </div>
      <p style={{ color:"#2d2d44", fontSize:12, marginTop:36 }}>5 levels · automata theory · browser-native</p>
    </div>
  );
}

// ─── App ──────────────────────────────────────────────────────────────────────

function App() {
  const [save, setSave] = useState(loadSave);
  const [screen, setScreen] = useState("menu");
  const [currentLevel, setCurrentLevel] = useState(LEVELS[0]);
  const completed = save.completed||[];
  const savedCodes = save.code||{};
  const persist = next => { setSave(next); writeSave(next); };
  const handleSave = useCallback((id,code) => {
    persist({...save, code:{...savedCodes,[id]:code}});
  }, [save]);
  const handleComplete = () => {
    const nc = [...new Set([...completed,currentLevel.id])];
    persist({...save,completed:nc});
    const ni = LEVELS.findIndex(l=>l.id===currentLevel.id)+1;
    if (ni<LEVELS.length) setCurrentLevel(LEVELS[ni]);
    else setScreen("select");
  };
  const startPlaying = () => {
    const next = LEVELS.find(l=>!completed.includes(l.id))||LEVELS[LEVELS.length-1];
    setCurrentLevel(next); setScreen("editor");
  };
  return (
    <div style={{ background:"#09090f", color:"#e2e2f2", height:"100dvh", overflow:"hidden" }}>
      {screen==="menu" && <MainMenu completed={completed} onStart={startPlaying} onSelectLevel={()=>setScreen("select")} onHowTo={()=>setScreen("howto")}/>}
      {screen==="howto" && <HowToPlay onBack={()=>setScreen("menu")}/>}
      {screen==="select" && <LevelSelect completed={completed} onSelect={lvl=>{setCurrentLevel(lvl);setScreen("editor");}} onBack={()=>setScreen("menu")}/>}
      {screen==="editor" && <EditorScreen level={currentLevel} onBack={()=>setScreen("select")} onComplete={handleComplete} savedCode={savedCodes[currentLevel.id]} onSave={handleSave}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
