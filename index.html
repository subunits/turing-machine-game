<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ─── Persistence ──────────────────────────────────────────────────────────────

const STORAGE_KEY = "turing_craft_v2";
function loadSave() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); } catch { return {}; } }
function writeSave(d) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); } catch {} }

// ─── Viewport ─────────────────────────────────────────────────────────────────

function useViewport() {
  const [vw, setVw] = useState(() => window.innerWidth);
  useEffect(() => {
    const u = () => setVw(window.innerWidth);
    window.addEventListener("resize", u);
    if (window.visualViewport) window.visualViewport.addEventListener("resize", u);
    return () => { window.removeEventListener("resize", u); if (window.visualViewport) window.visualViewport.removeEventListener("resize", u); };
  }, []);
  return { narrow: vw < 700 };
}

// ─── Simulator ────────────────────────────────────────────────────────────────

function createMachine(t, i, a, r) { return { transitions: t, initialState: i, acceptStates: a, rejectStates: r }; }

function runMachine(machine, inputStr, maxSteps = 1000) {
  const tape = inputStr === "" ? ["_"] : inputStr.split("");
  let head = 0, state = machine.initialState;
  const history = [{ tape: [...tape], head, state }];
  for (let step = 0; step < maxSteps; step++) {
    if (machine.acceptStates.includes(state)) return { accepted: true, tape, history, timedOut: false };
    if (machine.rejectStates.includes(state)) return { accepted: false, tape, history, timedOut: false };
    const symbol = tape[head] ?? "_";
    const st = machine.transitions[state];
    if (!st) return { accepted: false, tape, history, timedOut: false, error: `No state: ${state}` };
    const tr = st[symbol];
    if (!tr) return { accepted: false, tape, history, timedOut: false, error: `No transition: ${state} on ${symbol}` };
    const [ns, ws, dir] = tr;
    tape[head] = ws; state = ns;
    if (dir === "R") { head++; if (head >= tape.length) tape.push("_"); }
    else if (dir === "L") { head = Math.max(0, head - 1); }
    history.push({ tape: [...tape], head, state });
  }
  return { accepted: false, tape, history, timedOut: true };
}

function validateSolution(machine, testCases) {
  return testCases.map(tc => {
    const result = runMachine(machine, tc.input);
    const actualTape = result.tape.join("").replace(/_+$/, "");
    const passed = result.accepted && actualTape === tc.expected;
    return { ...tc, passed, actual: actualTape, accepted: result.accepted, timedOut: result.timedOut, history: result.history };
  });
}

// ─── Swipe ────────────────────────────────────────────────────────────────────

function useSwipe(onLeft, onRight) {
  const startX = useRef(null);
  const onTouchStart = (e) => { startX.current = e.touches[0].clientX; };
  const onTouchEnd = (e) => {
    if (startX.current === null) return;
    const dx = e.changedTouches[0].clientX - startX.current;
    if (Math.abs(dx) > 40) { dx < 0 ? onLeft() : onRight(); }
    startX.current = null;
  };
  return { onTouchStart, onTouchEnd };
}

// ─── Editor Screen Component ─────────────────────────────────────────────────

function EditorScreen({ level, onBack, onComplete, savedCode, onSave }) {
  const [code, setCode] = useState(savedCode ?? level.starter);
  const [results, setResults] = useState(null);
  const [error, setError] = useState(null);
  const [activeStepResult, setActiveStepResult] = useState(null);
  const [showHints, setShowHints] = useState(false);
  const [parsedMachine, setParsedMachine] = useState(null);
  const { narrow } = useViewport();

  const handleRun = () => {
    try {
      const parsed = JSON.parse(code);
      setError(null);
      setParsedMachine(parsed);
      const machine = createMachine(parsed, level.initial_state, level.accept_states, level.reject_states);
      const res = validateSolution(machine, level.test_cases);
      setResults(res);
      if (res.every(r => r.passed)) {
        onComplete();
      }
    } catch (e) {
      setError(e.message);
      setResults(null);
    }
  };

  useEffect(() => {
    try {
      setParsedMachine(JSON.parse(code));
    } catch {
      setParsedMachine(null);
    }
  }, [code]);

  return (
    <div style={{ flex: 1, display: "flex", flexDirection: "column", height: "100dvh", overflow: "hidden" }}>
      {/* Top Bar */}
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between",
        padding: "12px 16px", background: "#13131f", borderBottom: "1px solid #2d2d44", flexShrink: 0 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <button onClick={onBack} style={{ background: "#2d2d44", border: "none", borderRadius: 8,
            color: "#a5b4fc", width: 40, height: 40, cursor: "pointer", fontSize: 16,
            display: "flex", alignItems: "center", justifyContent: "center" }}>←</button>
          <div>
            <div style={{ fontSize: 11, color: "#6366f1", fontWeight: 700, textTransform: "uppercase" }}>Level {level.id}</div>
            <div style={{ fontSize: 15, fontWeight: 700, color: "#fff" }}>{level.name}</div>
          </div>
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <button onClick={() => setShowHints(true)} style={{ background: "#2d2d44", border: "1px solid #3d3d5e",
            borderRadius: 8, color: "#a5b4fc", padding: "8px 14px", cursor: "pointer", fontSize: 13, fontWeight: 600, minHeight: 40 }}>Hints</button>
          <button onClick={() => { setCode(level.starter); onSave(level.id, level.starter); }} style={{ background: "#2d2d44", border: "1px solid #3d3d5e",
            borderRadius: 8, color: "#aaa", padding: "8px 12px", cursor: "pointer", fontSize: 13, minHeight: 40 }}>Reset</button>
        </div>
      </div>

      {/* Main Content Area */}
      <div style={{ flex: 1, display: "flex", flexDirection: narrow ? "column" : "row", overflow: "hidden" }}>
        {/* Left / Top: Description & Editor */}
        <div style={{ flex: 1, display: "flex", flexDirection: "column", borderRight: narrow ? "none" : "1px solid #2d2d44", overflow: "hidden" }}>
          <div style={{ padding: 16, background: "#0e0e17", borderBottom: "1px solid #2d2d44", fontSize: 13, color: "#aaa", lineHeight: 1.5, flexShrink: 0 }}>
            {level.description}
          </div>
          <div style={{ flex: 1, display: "flex", flexDirection: "column", padding: 12, overflow: "hidden" }}>
            <textarea
              value={code}
              onChange={e => { setCode(e.target.value); onSave(level.id, e.target.value); }}
              spellCheck="false"
              style={{
                flex: 1, background: "#0a0a15", color: "#e2e2f2", border: "1px solid #2d2d44",
                borderRadius: 10, padding: 14, fontFamily: "monospace", fontSize: 13,
                lineHeight: 1.6, resize: "none", outline: "none",
              }}
            />
            {error && <div style={{ color: "#f87171", fontSize: 12, marginTop: 8, fontFamily: "monospace" }}>{error}</div>}
          </div>
          <div style={{ padding: 12, background: "#13131f", borderTop: "1px solid #2d2d44", flexShrink: 0 }}>
            <button onClick={handleRun} style={{
              width: "100%", background: "linear-gradient(135deg, #4f46e5, #7c3aed)", border: "none",
              borderRadius: 10, color: "#fff", padding: 14, cursor: "pointer", fontWeight: 700, fontSize: 15, minHeight: 48,
            }}>Run Tests →</button>
          </div>
        </div>

        {/* Right / Bottom: Test Results & Diagram */}
        <div style={{ width: narrow ? "100%" : "380px", display: "flex", flexDirection: "column", background: "#0c0c14", overflowY: "auto", flexShrink: 0 }}>
          <div style={{ padding: 16, borderBottom: "1px solid #2d2d44" }}>
            <div style={{ fontSize: 12, fontWeight: 700, color: "#888", textTransform: "uppercase", marginBottom: 12 }}>State Diagram</div>
            {parsedMachine ? <StateDiagram transitions={parsedMachine} currentState={null} /> : <div style={{ color: "#555", fontSize: 12 }}>Invalid JSON</div>}
          </div>
          <div style={{ padding: 16, flex: 1 }}>
            <div style={{ fontSize: 12, fontWeight: 700, color: "#888", textTransform: "uppercase", marginBottom: 12 }}>Test Cases</div>
            {results ? (
              <TestResults results={results} onStepThrough={r => setActiveStepResult(r)} />
            ) : (
              <div style={{ color: "#555", fontSize: 13, textAlign: "center", padding: 32 }}>Click "Run Tests" to verify your machine.</div>
            )}
          </div>
        </div>
      </div>

      {showHints && (
        <HintPanel
          hints={level.hints}
          onClose={() => setShowHints(false)}
          onUseSolution={sol => { setCode(sol); onSave(level.id, sol); }}
          narrow={narrow}
        />
      )}

      {activeStepResult && parsedMachine && (
        <StepModal
          result={activeStepResult}
          transitions={parsedMachine}
          onClose={() => setActiveStepResult(null)}
          narrow={narrow}
        />
      )}
    </div>
  );
}

// ─── Hint Panel ───────────────────────────────────────────────────────────────

function HintPanel({ hints, onClose, onUseSolution, narrow }) {
  const [idx, setIdx] = useState(0);
  const hint = hints[idx];
  const swipe = useSwipe(
    () => setIdx(i => Math.min(i + 1, hints.length - 1)),
    () => setIdx(i => Math.max(i - 1, 0))
  );

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.88)", zIndex: 100,
      display: "flex", alignItems: "center", justifyContent: "center" }} onClick={onClose}>
      <div style={{
        background: "#13131f", border: "1px solid #3d3d5e", borderRadius: 16,
        padding: narrow ? 16 : 24,
        width: narrow ? "100%" : "90%", maxWidth: 560,
        maxHeight: narrow ? "92dvh" : "85dvh",
        overflowY: "auto", display: "flex", flexDirection: "column", gap: 16,
        ...(narrow ? { position: "fixed", bottom: 0, left: 0, right: 0, borderBottomLeftRadius: 0, borderBottomRightRadius: 0 } : {}),
      }} onClick={e => e.stopPropagation()} {...swipe}>

        {/* Header */}
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div style={{ display: "flex", gap: 6 }}>
            {hints.map((h, i) => (
              <button key={i} onClick={() => setIdx(i)} style={{
                background: i === idx ? "#6366f1" : "#2d2d44",
                border: "none", borderRadius: 6, color: i === idx ? "#fff" : "#888",
                padding: "4px 12px", cursor: "pointer", fontSize: 12, fontWeight: 600, minHeight: 32,
              }}>{h.title}</button>
            ))}
          </div>
          <button onClick={onClose} style={{ background: "#2d2d44", border: "none", borderRadius: 8,
            color: "#aaa", fontSize: 18, width: 44, height: 44, cursor: "pointer",
            display: "flex", alignItems: "center", justifyContent: "center" }}>✕</button>
        </div>

        {/* Body */}
        <div style={{ flex: 1 }}>
          {hint.isCode ? (
            <pre style={{ background: "#0a0a15", border: "1px solid #2d2d44", borderRadius: 10,
              padding: 16, color: "#e2e2f2", fontSize: 12, lineHeight: 1.7,
              whiteSpace: "pre-wrap", overflowX: "auto", fontFamily: "monospace" }}>
              {hint.body}
            </pre>
          ) : (
            <pre style={{ color: "#ccc", fontSize: 14, lineHeight: 1.8, margin: 0,
              whiteSpace: "pre-wrap", fontFamily: "inherit" }}>{hint.body}</pre>
          )}
        </div>

        {/* Nav + use solution */}
        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
          <button onClick={() => setIdx(i => Math.max(i - 1, 0))} disabled={idx === 0} style={{
            background: idx === 0 ? "#1a1a2e" : "#2d2d44", border: "1px solid #3d3d5e",
            borderRadius: 8, color: idx === 0 ? "#333" : "#a5b4fc",
            minWidth: 44, minHeight: 44, cursor: idx === 0 ? "default" : "pointer", fontSize: 18,
          }}>←</button>
          <div style={{ flex: 1, textAlign: "center", color: "#555", fontSize: 13 }}>
            {idx + 1} / {hints.length}
          </div>
          <button onClick={() => setIdx(i => Math.min(i + 1, hints.length - 1))} disabled={idx === hints.length - 1} style={{
            background: idx === hints.length - 1 ? "#1a1a2e" : "#2d2d44", border: "1px solid #3d3d5e",
            borderRadius: 8, color: idx === hints.length - 1 ? "#333" : "#a5b4fc",
            minWidth: 44, minHeight: 44, cursor: idx === hints.length - 1 ? "default" : "pointer", fontSize: 18,
          }}>→</button>
        </div>

        {hint.isCode && (
          <button onClick={() => { onUseSolution(hint.body); onClose(); }} style={{
            background: "linear-gradient(135deg, #4f46e5, #7c3aed)", border: "none",
            borderRadius: 10, color: "#fff", padding: 14, cursor: "pointer",
            fontWeight: 700, fontSize: 15, minHeight: 50,
          }}>Use this solution →</button>
        )}
      </div>
    </div>
  );
}

// ─── Tape Viz ─────────────────────────────────────────────────────────────────

function TapeViz({ tape, head, state, stepIdx, totalSteps, narrow }) {
  const cellW = narrow ? 36 : 44, cellH = narrow ? 36 : 44, padding = 4;
  const visibleCount = narrow ? 9 : 13;
  const startIdx = Math.max(0, head - Math.floor(visibleCount / 2));
  const cells = Array.from({ length: visibleCount }, (_, i) => ({
    symbol: tape[startIdx + i] ?? "_", isHead: startIdx + i === head,
  }));
  const svgW = visibleCount * (cellW + padding) + padding;
  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 8 }}>
      <svg width={svgW} height={narrow ? 80 : 100} style={{ overflow: "visible", maxWidth: "100%" }}>
        {cells.map((cell, i) => {
          const x = i * (cellW + padding) + padding, y = narrow ? 20 : 28;
          return (
            <g key={i}>
              <rect x={x} y={y} width={cellW} height={cellH} rx={5}
                fill={cell.isHead ? "#6366f1" : cell.symbol === "_" ? "#1e1e2e" : "#2d2d44"}
                stroke={cell.isHead ? "#a5b4fc" : "#3d3d5e"} strokeWidth={cell.isHead ? 2 : 1} />
              <text x={x + cellW/2} y={y + cellH/2 + 5} textAnchor="middle"
                fontSize={narrow ? 14 : 18} fontFamily="monospace"
                fill={cell.isHead ? "#fff" : cell.symbol === "_" ? "#444" : "#c4c4d4"}>{cell.symbol}</text>
              {cell.isHead && <text x={x + cellW/2} y={y - 6} textAnchor="middle" fontSize={10} fill="#a5b4fc">▼</text>}
            </g>
          );
        })}
      </svg>
      <div style={{ display: "flex", gap: 16, fontSize: 12, color: "#888" }}>
        <span>State: <span style={{ color: "#a5b4fc", fontFamily: "monospace" }}>{state}</span></span>
        <span>Head: <span style={{ color: "#a5b4fc" }}>{head}</span></span>
        {totalSteps > 0 && <span>Step: <span style={{ color: "#a5b4fc" }}>{stepIdx + 1}/{totalSteps}</span></span>}
      </div>
    </div>
  );
}

// ─── State Diagram ────────────────────────────────────────────────────────────

function StateDiagram({ transitions, currentState }) {
  const states = Object.keys(transitions || {});
  if (states.length === 0) return null;
  const r = 26, svgW = 500, maxPerRow = Math.min(states.length, 5);
  const numRows = Math.ceil(states.length / maxPerRow);
  const svgH = 50 + numRows * 95;
  const positions = {};
  states.forEach((s, i) => {
    positions[s] = {
      x: 55 + (i % maxPerRow) * ((svgW - 110) / Math.max(maxPerRow - 1, 1)),
      y: 55 + Math.floor(i / maxPerRow) * 95,
    };
  });
  const edges = [];
  states.forEach(from => {
    const tm = {};
    Object.entries(transitions[from] || {}).forEach(([sym, arr]) => {
      if (!Array.isArray(arr)) return;
      const key = `${from}->${arr[0]}`;
      if (!tm[key]) tm[key] = [];
      tm[key].push(`${sym}:${arr[1]},${arr[2]}`);
    });
    Object.entries(tm).forEach(([key, labels]) => {
      const [f, t] = key.split("->");
      if (positions[f] && positions[t]) edges.push({ from: f, to: t, label: labels.join(" | ") });
    });
  });
  return (
    <svg width="100%" viewBox={`0 0 ${svgW} ${svgH}`}
      style={{ background: "#0f0f1a", borderRadius: 10, border: "1px solid #2d2d44" }}>
      <defs>
        <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
          <path d="M0,0 L0,6 L8,3 z" fill="#555" />
        </marker>
      </defs>
      {edges.map((e, i) => {
        const fp = positions[e.from], tp = positions[e.to];
        if (!fp || !tp) return null;
        if (e.from === e.to) return (
          <g key={i}>
            <path d={`M${fp.x-10},${fp.y-r} C${fp.x-36},${fp.y-64} ${fp.x+36},${fp.y-64} ${fp.x+10},${fp.y-r}`}
              fill="none" stroke="#3d3d5e" strokeWidth={1.5} markerEnd="url(#arr)" />
            <text x={fp.x} y={fp.y-62} textAnchor="middle" fontSize={8} fill="#666" fontFamily="monospace">{e.label}</text>
          </g>
        );
        const dx = tp.x-fp.x, dy = tp.y-fp.y, len = Math.sqrt(dx*dx+dy*dy);
        const ux = dx/len, uy = dy/len;
        const x1 = fp.x+ux*r, y1 = fp.y+uy*r, x2 = tp.x-ux*(r+8), y2 = tp.y-uy*(r+8);
        const mx = (x1+x2)/2 - uy*18, my = (y1+y2)/2 + ux*18;
        return (
          <g key={i}>
            <path d={`M${x1},${y1} Q${mx},${my} ${x2},${y2}`}
              fill="none" stroke="#3d3d5e" strokeWidth={1.5} markerEnd="url(#arr)" />
            <text x={mx} y={my-3} textAnchor="middle" fontSize={8} fill="#666" fontFamily="monospace">{e.label}</text>
          </g>
        );
      })}
      {states.map(s => {
        const p = positions[s]; if (!p) return null;
        const isAccept = s === "accept", isReject = s === "reject", isActive = s === currentState;
        return (
          <g key={s}>
            <circle cx={p.x} cy={p.y} r={r}
              fill={isActive ? "#6366f1" : isAccept ? "#1a3a2a" : isReject ? "#3a1a1a" : "#1e1e2e"}
              stroke={isActive ? "#a5b4fc" : isAccept ? "#4ade80" : isReject ? "#f87171" : "#3d3d5e"}
              strokeWidth={isActive ? 2.5 : 1.5} />
            {isAccept && <circle cx={p.x} cy={p.y} r={r-4} fill="none" stroke="#4ade80" strokeWidth={1} />}
            <text x={p.x} y={p.y+4} textAnchor="middle" fontSize={9} fontFamily="monospace"
              fill={isActive ? "#fff" : isAccept ? "#4ade80" : isReject ? "#f87171" : "#aaa"}>
              {s.length > 7 ? s.slice(0,6)+"…" : s}
            </text>
          </g>
        );
      })}
    </svg>
  );
}

// ─── Test Results ─────────────────────────────────────────────────────────────

function TestResults({ results, onStepThrough }) {
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
      {results.map((r, i) => (
        <div key={i} style={{
          background: r.passed ? "#0d2a1a" : "#2a0d0d",
          border: `1px solid ${r.passed ? "#4ade80" : "#f87171"}`,
          borderRadius: 8, padding: "12px 14px",
        }}>
          <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 10 }}>
            <div style={{ display: "flex", gap: 10, alignItems: "flex-start" }}>
              <span style={{ fontSize: 16, lineHeight: 1.4 }}>{r.passed ? "✓" : "✗"}</span>
              <div>
                <div style={{ fontSize: 12, color: "#888", marginBottom: 2 }}>{r.description}</div>
                <div style={{ fontFamily: "monospace", fontSize: 13, color: "#ccc" }}>
                  <span style={{ color: "#888" }}>in:</span> "{r.input}"&nbsp;
                  <span style={{ color: "#888" }}>exp:</span> "{r.expected}"
                </div>
                {!r.passed && (
                  <div style={{ fontFamily: "monospace", fontSize: 13, color: "#f87171", marginTop: 2 }}>
                    got: "{r.actual}"{r.timedOut ? " (timed out)" : ""}
                  </div>
                )}
              </div>
            </div>
            {!r.passed && r.history && (
              <button onClick={() => onStepThrough(r)} style={{
                background: "#2d2d44", border: "1px solid #4d4d70", borderRadius: 8,
                color: "#a5b4fc", fontSize: 13, padding: "10px 14px",
                cursor: "pointer", whiteSpace: "nowrap", minHeight: 44, flexShrink: 0,
              }}>Step →</button>
            )}
          </div>
        </div>
      ))}
    </div>
  );
}

// ─── Step Modal ───────────────────────────────────────────────────────────────

function tbStyle(disabled) {
  return {
    background: disabled ? "#1a1a2e" : "#2d2d44", border: "1px solid #3d3d5e", borderRadius: 8,
    color: disabled ? "#333" : "#a5b4fc", minWidth: 64, minHeight: 44, padding: "10px 14px",
    cursor: disabled ? "default" : "pointer", fontSize: 15, fontWeight: 600,
  };
}

function StepModal({ result, transitions, onClose, narrow }) {
  const [stepIdx, setStepIdx] = useState(0);
  const total = result.history.length;
  const frame = result.history[Math.min(stepIdx, total - 1)];
  const goNext = useCallback(() => setStepIdx(s => Math.min(s + 1, total - 1)), [total]);
  const goPrev = useCallback(() => setStepIdx(s => Math.max(s - 1, 0)), []);
  useEffect(() => {
    const h = (e) => { if (e.key === "ArrowRight") goNext(); if (e.key === "ArrowLeft") goPrev(); if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, [goNext, goPrev, onClose]);
  const swipe = useSwipe(goNext, goPrev);
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.88)", zIndex: 100,
      display: "flex", alignItems: "center", justifyContent: "center" }} onClick={onClose}>
      <div style={{
        background: "#13131f", border: "1px solid #3d3d5e", borderRadius: 16,
        padding: narrow ? 16 : 28, width: narrow ? "100%" : "90%", maxWidth: 680,
        maxHeight: narrow ? "92dvh" : "90dvh", overflowY: "auto",
        display: "flex", flexDirection: "column", gap: 16,
        ...(narrow ? { position: "fixed", bottom: 0, left: 0, right: 0, borderBottomLeftRadius: 0, borderBottomRightRadius: 0 } : {}),
      }} onClick={e => e.stopPropagation()} {...swipe}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div>
            <div style={{ color: "#fff", fontWeight: 600, fontSize: 15 }}>"{result.input}"</div>
            <div style={{ color: "#666", fontSize: 12, marginTop: 2 }}>Swipe or tap to step</div>
          </div>
          <button onClick={onClose} style={{ background: "#2d2d44", border: "none", borderRadius: 8,
            color: "#aaa", fontSize: 18, width: 44, height: 44, cursor: "pointer",
            display: "flex", alignItems: "center", justifyContent: "center" }}>✕</button>
        </div>
        <TapeViz tape={frame.tape} head={frame.head} state={frame.state} stepIdx={stepIdx} totalSteps={total} narrow={narrow} />
        <StateDiagram transitions={transitions} currentState={frame.state} />
        <div style={{ display: "flex", gap: 8, justifyContent: "center" }}>
          <button onClick={() => setStepIdx(0)} disabled={stepIdx === 0} style={tbStyle(stepIdx === 0)}>⟪</button>
          <button onClick={goPrev} disabled={stepIdx === 0} style={tbStyle(stepIdx === 0)}>←</button>
          <div style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", color: "#555", fontSize: 13 }}>{stepIdx + 1} / {total}</div>
          <button onClick={goNext} disabled={stepIdx === total-1} style={tbStyle(stepIdx === total-1)}>→</button>
          <button onClick={() => setStepIdx(total-1)} disabled={stepIdx === total-1} style={tbStyle(stepIdx === total-1)}>⟫</button>
        </div>
      </div>
    </div>
  );
}

// ─── Main App Shell & Component Logic ─────────────────────────────────────────

function App() {
  const [save, setSave] = useState(loadSave());
  const [currentLevelId, setCurrentLevelId] = useState(null);
  const { narrow } = useViewport();

  const handleSave = (levelId, code) => {
    const updated = { ...save, [levelId]: code };
    setSave(updated);
    writeSave(updated);
  };

  const handleComplete = (levelId) => {
    const updated = { ...save, [`completed_${levelId}`]: true };
    setSave(updated);
    writeSave(updated);
  };

  const currentLevel = LEVELS.find(l => l.id === currentLevelId);

  if (!currentLevel) {
    return (
      <div style={{ flex: 1, overflowY: "auto", padding: narrow ? 16 : 32, maxWidth: 800, margin: "0 auto", width: "100%" }}>
        <div style={{ marginBottom: 24 }}>
          <h1 style={{ fontSize: narrow ? 24 : 32, fontWeight: 800, color: "#fff", marginBottom: 8 }}>Turing Craft</h1>
          <p style={{ color: "#888", fontSize: narrow ? 13 : 15 }}>Learn automata theory by building and solving state machine puzzles.</p>
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          {LEVELS.map(level => {
            const isCompleted = save[`completed_${level.id}`];
            return (
              <div key={level.id} onClick={() => setCurrentLevelId(level.id)} style={{
                background: "#13131f", border: "1px solid #2d2d44", borderRadius: 12,
                padding: narrow ? 16 : 20, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "between",
                transition: "border-color 0.2s",
              }}>
                <div style={{ flex: 1 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
                    <span style={{ fontSize: 11, color: "#6366f1", fontWeight: 700, textTransform: "uppercase" }}>Level {level.id}</span>
                    {isCompleted && <span style={{ fontSize: 11, color: "#4ade80", fontWeight: 600 }}>✓ Completed</span>}
                  </div>
                  <div style={{ fontSize: 16, fontWeight: 700, color: "#fff", marginBottom: 4 }}>{level.name}</div>
                  <div style={{ fontSize: 13, color: "#888" }}>{level.description}</div>
                </div>
                <div style={{ fontSize: 18, color: "#555", marginLeft: 16 }}>→</div>
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  return (
    <EditorScreen
      level={currentLevel}
      onBack={() => setCurrentLevelId(null)}
      onComplete={() => handleComplete(currentLevel.id)}
      savedCode={save[currentLevel.id]}
      onSave={handleSave}
    />
  );
}

ReactDOM.render(<App />, document.getElementById("root"));
</script>
</body>
</html>
